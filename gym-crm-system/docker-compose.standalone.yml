services:
  gym-crm:
    build:
      context: .
      dockerfile: gym-crm-service/Dockerfile
    image: gym-crm:standalone
    container_name: gym-crm-standalone
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker-standalone
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_JMS_LISTENER_AUTO_STARTUP: "false"
      JWT_SECRET: ${JWT_SECRET_STANDALONE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - standalone-net

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    image: report-service:standalone
    container_name: report-service-standalone
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker-standalone
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_JMS_LISTENER_AUTO_STARTUP: "false"
      SPRING_DATA_MONGODB_URI: mongodb://report-mongo:27017/report_db_standalone
    depends_on:
      report-mongo:
        condition: service_healthy
    networks:
      - standalone-net

  report-mongo:
    image: mongo:7.0
    container_name: report-mongo-standalone
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - standalone-net

networks:
  standalone-net:
    driver: bridge
