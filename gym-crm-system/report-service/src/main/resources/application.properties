server.port=8081
spring.application.name=report-service
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:}
spring.activemq.password=${ACTIVEMQ_PASSWORD:}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/report_db}
